<!DOCTYPE html>
<html>
<head>
<style>
  .container {
    display: flex;
    flex-direction: column; /* default: divovi jedan ispod drugog */
  }

  .box {
    background-color: teal;
    color: white;
    padding: 20px;
    margin: 5px;
  }

  /* Kada je ekran veći od 768px */
  @media (min-width: 768px) {
    .container {
      flex-direction: row; /* divovi idu jedan pored drugog */
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="box">Div 1</div>
  <div class="box">Div 2</div>
  <div class="box">Div 3</div>
</div>

</body>
</html>
