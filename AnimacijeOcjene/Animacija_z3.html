<head>

    <style>
div{
width: 200px;
height: 200px;
box-sizing: border-box;
padding: 80px;
background-color: lightblue;

animation-direction: alternate;
animation-duration: 1.8s;
}
@keyframes Njac3{
25%{
}
100%{

}
}

</head>

    <div></div>

- Trajanje animacije: 1.8 sekundi -->
