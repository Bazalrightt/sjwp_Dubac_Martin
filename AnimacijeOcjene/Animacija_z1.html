<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animacija Zadatak 1</title>
    <style>
div{
    margin-top: 200px;
    margin-left: 150px;
width: 150px;
height: 150px;
border-radius: 50%;
border-color: black;
background-color: black;
animation-name: Njac1;
animation-iteration-count: infinite;
animation-direction: alternate;
animation-duration: 2s;
}
@keyframes Njac1{
0%{
transform: scale(1);
}
100%{
transform: scale(1.3);
}


}


    </style>
</head>
<body>
    <div></div>
</body>
</html>
<!-- Zadatak 1: Pulsirajući krug
Napravi kružni element koji se &quot;povećava i smanjuje&quot;.
- Koristi transform: scale()
- Maksimalno povećanje: 1.3
- Trajanje animacije: 2 sekunde
- Animacija se ponavlja beskonačno -->
