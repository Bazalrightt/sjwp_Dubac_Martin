<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animacija Zadatak 5</title>
    <style>
.t1{
height: 60px;
width: 60px;
margin-top: 100px;
margin-left: 100px;
border-radius: 50%;
background-color: gray;
animation-name: Njac5;
animation-delay: 1s;
animation-iteration-count: infinite;
animation-duration: 2s;
}
.t2{
height: 60px;
width: 60px;
margin-top: 50px;
margin-left: 100px;
border-radius: 50%;
background-color: gray;
animation-name: Njac5;
opacity: 1;
animation-delay: 1s;
animation-iteration-count: infinite;
animation-duration: 4s;
}
.t3{
height: 60px;
width: 60px;
margin-top: 50px;
margin-left: 100px;
border-radius: 50%;
background-color: gray;
animation-name: Njac5;
animation-delay: 1s;
animation-iteration-count: infinite;
animation-duration: 6s;
}
@keyframes Njac5{
0%{
opacity: 0.2;
}
100%{
    opacity: 1;
}

}




    </style>
</head>
<body>
    <div class="t1"></div>
    <div class="t2"></div>
    <div class="t3"></div>
</body>
</html>
<!-- Zadatak 5: Točkasti učitavač
Napravi indikator učitavanja s tri kružne točke.
- Točke se pojavljuju jedna za drugom
- Koristi animation-delay
- Animacija je neprekidna -->
