<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Zadatak</title>
    <style>
        *{
    margin: 0;
    box-sizing: border-box;
}

.box{
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    height: 100vh;
}

.box div{
    border: 2px solid white;
}

.a, .b{
    background: orange;
}
.c{
    background: yellowgreen;
}
.d, .e, .f{
    background: steelblue;
}

.box div{
    flex: 0 100%;
    height: 16.67%;
}
@media(max-width: 768px){
    .a{
        flex: 0 20%;
        height: 20%;
    }
  
}
    </style>
</head>
<body>
    <div class="box">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"></div>
        <div class="d"></div>
        <div class="e"></div>
        <div class="f"></div>
        <div class="g"></div>
        <div class="h"></div>
        <div class="i"></div>
        <div class="j"></div>
    </div>
</body>
</html>
