<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .body{
            color:white;
            height: 100vh;
        }
.container{
    display: flex;
flex-direction: column;
height: 100vh;
gap: 10px;
}
.a,.b,.c,.d,.e,.f,.g,.h{

background-color: aquamarine;
height: 20px;
   
}
.container> div{
    width: 100%;
    height: 25%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px
}

@media (min-width:1024px) {
    .container{
        flex-direction: row;
        flex-wrap: wrap;
    }
  .container>div{
    width: 20%;
    height: 50vh;
  }
}
 @media (min-width:768px) and (max-width:1023px) {
         .container {
      flex-direction:column; 
      flex-wrap:wrap;
    }
  
   
     .container > div{
height: 20%;
width: 100vh;
    }
    }


    </style>
</head>

<body>
    <div class="container">
        <div class="a">D1</div>
        <div class="b">D2</div>
        <div class="c">D3</div>
        <div class="d">D4</div>
        <div class="e">D5</div>
        <div class="f">D6</div>
        <div class="g">D7</div>
        <div class="h">D8</div>
    </div>
</body>
</html>
