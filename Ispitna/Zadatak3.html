<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .body{
            
            height: 100vh;
        }
.container{
    display: flex;
flex-direction: column;
height: 100vh;
gap: 10px;
}
.a{
background-color: lightblue;
}
.b{
background-color: lightgreen;
}
.c{
background-color: burlywood;
}
.d{
    background-color: plum;
}
.e{
    background-color: tomato;
}
.f{
    background-color: gainsboro;
}
.container> div{
    width: 100%;
    height: 25%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px
}

@media (min-width:1024px) {
    .container{
        flex-direction: row;
        flex-wrap: wrap;
    }
  .container>div{
    width: 30%;
    height: 50vh;
  }
}
 @media (min-width:768px) and (max-width:1023px) {
         .container {
      flex-direction:row; 
      flex-wrap:wrap;
    }
  
   
     .container > div{
height: 40%;
width: 50vh;
    }
    }



    </style>
</head>
<body>
    <div class="container">
        <div class="a">korisnici</div>
        <div class="b">Prodaja</div>
        <div class="c">Poruke</div>
        <div class="d">Statistika</div>
        <div class="e">zadatci</div>
        <div class="f">Postavke</div>
    </div>
</body>
</html>
