<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadatak 1</title>
    <style>
div{
width: 200px;
height: 200px;
margin-left: 150px;
margin-top: 150px;
box-sizing: border-box; 
padding: 80px;
background-color: red;
animation-name: Njac1;
animation-duration: 3s;
animation-iteration-count: infinite;
}
@keyframes Njac1{
0%{
   transform:scale(1);
}
100%{
    transform: scale(2)
}
}
    </style>
</head>
<body>
    <div>Njac</div>
   <!--  Napravi gumb s tekstom „Klikni me“ koji se lagano povećava i smanjuje.
- Trajanje animacije: 2 sekunde
- Animacija se ponavlja beskonačno
- Koristi transform: scale() -->
</body>
</html>
