<head>
    <meta charset="UTF-8">

    <title>Zadatak 2</title>
    <style>
div{
width: 200px;
height: 200px;
box-sizing: border-box;
padding: 80px;
margin-left: 250px;
margin-top: 250px;
animation-name: Promjena;
background-color: red;
animation-duration: 4s;
animation-iteration-count: infinite;
}
@keyframes Promjena{
25%{
background-color: green;
}
75%{
    background-color: blue;
}
}
    </style>
</head>
<body>
    <div>Njac</div>
</body>
