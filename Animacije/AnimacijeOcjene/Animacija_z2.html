<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animacija zadatak 2</title>
    <style>
.t1{
    

        font-size: xx-large;
        text-align: center;
        border-radius: 50%; 
        animation-name:  Njac2;
        animation-direction: alternate;
        animation-iteration-count: infinite;
        animation-duration: 3s;

}
@keyframes Njac2{
0%{
    opacity: 0;
}
100%{
opacity: 1;
}

}
    </style>
</head>
<body>
    <div class="t1">Njac</div>
</body>
</html>


<!-- Napravi tekst koji se postupno pojavljuje i nestaje.
- Koristi opacity
- Tekst mora biti centriran
- Trajanje animacije: 3 sekunde
- Animacija ide naprijed–nazad (alternate) -->
