<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Animacija zadatak 4</title>
    <style>
        div{
width: 200px;
height: 200px;
box-sizing: border-box;
padding: 80px;
margin-left: 350px;
margin-top: 350px;
background-color: orangered;
}
div:hover{
    
     transition-duration: 0.5s;
    transform: scale(1.3);
background-color: yellowgreen;
box-shadow: 10px 10px;
}


    </style>
</head>
<body>
    <div>Prijelaz</div>
</body>
</html>
